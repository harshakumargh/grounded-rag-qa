[project]
name = "grounded-rag-qa"
version = "0.1.0"
description = "Grounded document Q&A: LangChain + Qdrant + Groq, answering only from retrieved context."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langchain-huggingface>=1.3.0",
    "langchain-qdrant>=1.2.0",
    "langchain-text-splitters>=1.2.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.15.1",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
grounded-rag = "grounded_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
